# ============================================================
# Site metadata
# ============================================================
site_name: 阿明
site_description: 技术、编程与生活的个人博客
site_author: 阿明
site_url: https://<zhumingjun1>.github.io/<Web>/
copyright: Copyright &copy; 2026 阿明

# ============================================================
# Theme
# ============================================================
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

# ============================================================
# Plugins
# ============================================================
plugins:
  - search:
      lang: zh

  - blog:
      blog_dir: blog
      post_dir: blog/posts
      post_url_format: "{date}/{slug}"
      post_url_date_format: yyyy/MM/dd
      post_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      post_readtime: true
      post_readtime_words_per_minute: 200
      archive: true
      archive_name: 归档
      archive_date_format: yyyy年MM月
      archive_url_date_format: yyyy/MM
      archive_url_format: "archive/{date}"
      categories: true
      categories_name: 分类
      categories_url_format: "category/{slug}"
      categories_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      pagination: true
      pagination_per_page: 10
      pagination_format: "$link_first $link_previous ~2~ $link_next $link_last"
      draft: false
      draft_on_serve: true
      authors: true

  - tags:
      tags_file: tags.md
      tags_name: 标签
      tags_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  - rss:
      enabled: true
      use_git: false
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
        as_update: updated
      categories:
        - categories
        - tags
      length: 20
      abstract_chars_count: 160
      feed_ttl: 1440
      pretty_print: true

# ============================================================
# Navigation
# ============================================================
nav:
  - 首页: index.md
  - 博客: blog/index.md
  - 标签: tags.md
  - 关于: about.md

# ============================================================
# Markdown extensions
# ============================================================
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys

# ============================================================
# Extra
# ============================================================
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/<zhumingjun1>
